[package]
name = "atom-rs"
version = "0.1.1"
edition = "2024"
description = "A cycle-accurate Acorn Atom emulator (learning project)"
license = "GPL-2.0-only"

[dependencies]
cpal = "0.18.2"
eframe = "0.37.0"
flate2 = "1.1.11"
png = "0.18.1"
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sidera = "1.1.1"
ureq = "3.5.2"
zip = { version = "9.8.2", default-features = false, features = ["deflate"] }

# The SingleStepTests run millions of instructions; optimise tests so a plain
# `cargo test` is fast enough.
[profile.test]
opt-level = 3

# Emulators need speed even in debug builds: optimise our code a little and
# dependencies (egui, serde) fully.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
