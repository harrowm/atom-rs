# Builds the emulator for each platform and publishes a GitHub Release.
#
#   git tag v0.1.0 && git push --tags
#
# makes a release called v0.1.0 with one download per platform: the program,
# the ROMs, the README and the licence in a single archive. Running it by hand
# (Actions > Release > Run workflow) builds the same archives but publishes
# nothing; they are kept as downloads of the run for 14 days, for testing.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # one platform failing must not hide the others
      matrix:
        include:
          # Linux is built on the OLDEST Ubuntu GitHub still offers, not
          # ubuntu-latest: a program needs the C library (glibc) it was built
          # against or newer, so building on a new Ubuntu gives archives that
          # will not start on any older one.
          - { name: linux-x86_64,   os: ubuntu-22.04,     target: x86_64-unknown-linux-gnu,    test: true }
          - { name: macos-arm64,    os: macos-latest,     target: aarch64-apple-darwin,        test: true }
          # Built on the Apple silicon runner; the Intel binary is not run here.
          - { name: macos-x86_64,   os: macos-latest,     target: x86_64-apple-darwin,         test: false }
          - { name: windows-x86_64, os: windows-latest,   target: x86_64-pc-windows-msvc,      test: true }
          # Cross-compiled on the x86_64 runner.
          - { name: windows-arm64,  os: windows-latest,   target: aarch64-pc-windows-msvc,     test: false }
          # Free for public repositories only.
          - { name: linux-arm64,    os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu,   test: true }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install system libraries (sound)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: Swatinem/rust-cache@v2
        with:
          # The OS too: a cache built on another Ubuntu version does not fit.
          key: ${{ matrix.os }}-${{ matrix.target }}

      # The tests that need downloaded data skip themselves here (the full set
      # runs in CI); the ones that boot the real ROMs run on every platform
      # that can run what it built.
      - name: Test
        if: matrix.test
        run: cargo test --release --target ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        id: package
        run: |
          version="${GITHUB_REF_NAME}"
          [ "$GITHUB_REF_TYPE" = tag ] || version="dev-${GITHUB_SHA::7}"
          folder="atom-rs-${version}-${{ matrix.name }}"
          mkdir -p "dist/$folder"
          exe=atom-rs
          [ "$RUNNER_OS" = Windows ] && exe=atom-rs.exe
          cp "target/${{ matrix.target }}/release/$exe" "dist/$folder/"
          cp -r roms README.md LICENSE "dist/$folder/"
          cd dist
          if [ "$RUNNER_OS" = Windows ]; then
            7z a -tzip "$folder.zip" "$folder" > /dev/null
            echo "file=$folder.zip" >> "$GITHUB_OUTPUT"
          else
            tar czf "$folder.tar.gz" "$folder"
            echo "file=$folder.tar.gz" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ steps.package.outputs.file }}
          retention-days: 14

  publish:
    name: Publish the release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the release
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
